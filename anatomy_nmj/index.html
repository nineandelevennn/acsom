<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>USMLE Step 1 Neurology - Neuromuscular Junction Flashcards</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        slide: {
                            red: '#E31B23',
                            darkred: '#C4121A',
                            bg: '#F4F5F7',
                            card: '#FFFFFF',
                            text: '#1A1A1A',
                            subtext: '#555555',
                            border: '#E2E8F0'
                        }
                    },
                    animation: {
                        'pop': 'pop 0.2s ease-out'
                    },
                    keyframes: {
                        pop: {
                            '0%': { transform: 'scale(0.97)' },
                            '100%': { transform: 'scale(1)' }
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Lock screen to 100dvh with zero page scrolling on mobile */
        html, body {
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
            position: fixed;
            touch-action: manipulation;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #F4F5F7;
            color: #1A1A1A;
        }

        /* Fluid text sizing for mobile viewports */
        .text-clamp-title {
            font-size: clamp(0.9rem, 4vw, 1.25rem);
        }
        .text-clamp-prompt {
            font-size: clamp(0.85rem, 3.8vw, 1.1rem);
            line-height: 1.35;
        }
        .text-clamp-option {
            font-size: clamp(0.78rem, 3.2vw, 0.92rem);
            line-height: 1.25;
        }

        button, a {
            -webkit-tap-highlight-color: transparent;
        }

        /* Custom subtle scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #F1F5F9;
        }
        ::-webkit-scrollbar-thumb {
            background: #E31B23;
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-slide-bg text-slide-text flex flex-col justify-between select-none antialiased h-[100dvh] max-h-[100dvh] w-full p-0 m-0 border-box">

    <!-- SLIDE-STYLE BRIGHT RED HEADER BANNER -->
    <header class="shrink-0 bg-slide-red text-white w-full shadow-md py-2 px-3 sm:px-4">
        <div class="max-w-md mx-auto flex items-center justify-between gap-2">
            <!-- GO BACK BUTTON LINKING TO ACSOM -->
            <a href="https://nineandelevennn.github.io/acsom/" target="_self" class="inline-flex items-center gap-1 px-2.5 py-1 bg-white/15 hover:bg-white/25 text-white text-xs font-bold rounded-lg border border-white/30 transition-all active:scale-95 shrink-0">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
                Go Back
            </a>

            <!-- CENTER LECTURE TITLE -->
            <div class="text-center flex-1 min-w-0">
                <h1 class="font-black text-white text-clamp-title tracking-wider uppercase truncate">USMLE STEP 1 NEUROLOGY</h1>
                <p class="text-[9px] text-white/90 font-medium tracking-widest uppercase truncate">American Canadian School of Medicine</p>
            </div>

            <!-- RESET STATS BUTTON -->
            <button id="resetStatsBtn" class="px-2 py-1 bg-white/15 hover:bg-white/25 text-white text-xs font-medium rounded-lg border border-white/30 transition-all active:scale-95 shrink-0 flex items-center gap-1">
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                <span class="hidden sm:inline">Reset</span>
            </button>
        </div>
    </header>

    <!-- MAIN WRAPPER CONTAINER -->
    <div class="flex-1 min-h-0 w-full max-w-md mx-auto flex flex-col justify-between px-2.5 py-2 sm:px-4 box-border">

        <!-- CATEGORY / MODULE SELECTOR DROPDOWN & STATS BAR -->
        <section class="shrink-0 flex flex-col gap-2 w-full my-0.5">
            <!-- MODULE SELECTOR -->
            <div class="relative w-full">
                <select id="daySelect" class="w-full bg-white text-slide-text font-bold text-xs sm:text-sm py-2 px-3 pr-8 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-slide-red appearance-none shadow-sm cursor-pointer transition-all">
                    <option value="all" selected>Neuromuscular Junction (20-Question Quick Quiz)</option>
                </select>
                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-slide-red">
                    <svg class="w-4 h-4 fill-current" viewBox="0 0 20 20"><path d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"/></svg>
                </div>
            </div>

            <!-- STATS DASHBOARD BAR -->
            <div class="grid grid-cols-3 gap-2 w-full">
                <!-- DONE STAT -->
                <div class="bg-white border border-slate-200 rounded-xl p-1.5 flex flex-col items-center justify-center shadow-sm">
                    <span class="text-[9px] uppercase font-bold text-slide-subtext tracking-wider">Done</span>
                    <span id="statDone" class="text-base font-black text-slate-800">0</span>
                </div>

                <!-- ACCURACY STAT -->
                <div class="bg-white border border-slate-200 rounded-xl p-1.5 flex flex-col items-center justify-center shadow-sm">
                    <span class="text-[9px] uppercase font-bold text-slide-subtext tracking-wider">Correct</span>
                    <div class="flex items-baseline gap-1">
                        <span id="statCorrect" class="text-base font-black text-emerald-600">0</span>
                        <span id="statAccuracy" class="text-[9px] text-slate-500 font-medium">(0%)</span>
                    </div>
                </div>

                <!-- STREAK STAT -->
                <div class="bg-white border border-slate-200 rounded-xl p-1.5 flex flex-col items-center justify-center shadow-sm">
                    <span class="text-[9px] uppercase font-bold text-slide-subtext tracking-wider flex items-center gap-0.5">
                        Streak
                        <svg class="w-3 h-3 text-amber-500" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M12.395 2.553a1 1 0 00-1.45-1.048c-2.5 1.249-4.2 3.824-4.2 6.551 0 2.228 1.135 4.103 2.8 5.15C8.3 13.9 7 15.65 7 17.5c0 .28.02.55.06.81a1 1 0 001.6.66c1.8-1.35 3.34-3.23 3.34-5.47 0-1.34-.5-2.55-1.35-3.48 1.8 1.34 3.35 3.23 3.35 5.47 0 1.25-.4 2.4-1.08 3.33a1 1 0 001.44 1.28c1.6-1.5 2.64-3.6 2.64-5.95 0-3.3-1.85-6.1-4.59-7.62z" clip-rule="evenodd"/></svg>
                    </span>
                    <span id="statStreak" class="text-base font-black text-amber-500">0</span>
                </div>
            </div>
        </section>

        <!-- MAIN QUESTION CARD CONTAINER -->
        <main class="flex-1 min-h-0 w-full flex flex-col justify-between bg-white border border-slate-300 rounded-2xl p-3 shadow-md relative overflow-hidden my-1">
            
            <!-- CARD HEADER INFO -->
            <div class="shrink-0 flex items-center justify-between pb-1.5 border-b border-slate-200">
                <span id="cardCategoryBadge" class="px-2.5 py-0.5 text-[10px] font-bold uppercase tracking-wider bg-red-50 text-slide-red border border-red-200 rounded-full">
                    Neuromuscular Junction
                </span>
                <span id="cardProgressText" class="text-[11px] font-semibold text-slate-500">
                    Card 1 of 20
                </span>
            </div>

            <!-- QUESTION PROMPT BOX -->
            <div class="flex-1 min-h-0 flex items-center justify-center p-3 my-2 bg-slate-50 border border-slate-200 rounded-xl text-center shadow-inner overflow-y-auto">
                <p id="questionPrompt" class="font-bold text-slate-900 text-clamp-prompt text-balance">
                    Prompt loading...
                </p>
            </div>

            <!-- OPTIONS GRID CONTAINER -->
            <div id="optionsContainer" class="shrink-0 grid grid-cols-1 gap-2 my-1">
                <!-- Dynamic Option Buttons render here -->
            </div>

            <!-- EXPLANATION / KEY POINT FEEDBACK PANEL -->
            <div id="explanationBox" class="shrink-0 hidden p-2.5 bg-slate-50 border border-slate-300 rounded-xl my-1 text-xs animate-pop overflow-y-auto max-h-[110px]">
                <div class="flex items-center gap-1.5 font-bold mb-1" id="feedbackTitle">
                    <!-- Correct/Incorrect indicator -->
                </div>
                <p id="explanationText" class="leading-relaxed text-[11px] sm:text-xs text-slate-700">
                    Key point explanation...
                </p>
            </div>

            <!-- NEXT QUESTION BUTTON CONTAINER -->
            <div id="nextBtnContainer" class="shrink-0 hidden mt-1">
                <button id="nextBtn" class="w-full py-2.5 px-4 bg-slide-red hover:bg-slide-darkred text-white font-bold text-xs sm:text-sm rounded-xl shadow-md active:scale-[0.98] transition-all flex items-center justify-center gap-2 cursor-pointer">
                    <span>Next Question</span>
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
                </button>
            </div>

        </main>

        <!-- FOOTER INFO -->
        <footer class="shrink-0 text-center text-[10px] text-slate-500 py-0.5">
            USMLE Step 1 High-Yield Review &bull; Neuromuscular Junction
        </footer>
    </div>

    <script>
        const QUIZ_DATA = [
            {
                day: 1,
                dayTitle: "Motor End Plate",
                prompt: "What is the motor end plate?",
                answer: "Specialized postsynaptic region of the skeletal muscle membrane",
                options: [
                    "Presynaptic portion of the motor neuron",
                    "Region of the sarcoplasmic reticulum containing calcium",
                    "Specialized postsynaptic region of the skeletal muscle membrane"
                ],
                explanation: "The motor end plate is the specialized postsynaptic area of a muscle fiber membrane that contains nicotinic acetylcholine receptors."
            },
            {
                day: 1,
                dayTitle: "Synaptic Cleft",
                prompt: "What is found within the basal lamina of the NMJ?",
                answer: "Acetylcholinesterase",
                options: [
                    "Acetylcholinesterase",
                    "Acetylcholine receptors",
                    "Voltage-gated calcium channels"
                ],
                explanation: "Acetylcholinesterase is anchored within the basal lamina of the synaptic cleft to rapidly degrade acetylcholine and end synaptic transmission."
            },
            {
                day: 1,
                dayTitle: "Nicotinic Receptor",
                prompt: "The receptor for acetylcholine at the skeletal muscle NMJ is:",
                answer: "Nicotinic receptor",
                options: [
                    "Muscarinic receptor",
                    "Nicotinic receptor",
                    "β1-adrenergic receptor"
                ],
                explanation: "Nicotinic acetylcholine receptors (Nm) mediate fast neurotransmission at the neuromuscular junction."
            },
            {
                day: 1,
                dayTitle: "Nicotinic Receptor Type",
                prompt: "The nicotinic acetylcholine receptor is:",
                answer: "Ligand-gated ion channel",
                options: [
                    "G-protein-coupled receptor",
                    "Intracellular receptor",
                    "Ligand-gated ion channel"
                ],
                explanation: "Nicotinic acetylcholine receptors are ionotropic ligand-gated cation channels that allow fast influx of sodium upon binding ACh."
            },
            {
                day: 1,
                dayTitle: "Presynaptic Calcium",
                prompt: "What directly triggers acetylcholine vesicle fusion?",
                answer: "Ca²⁺ influx",
                options: [
                    "Na⁺ influx",
                    "Ca²⁺ influx",
                    "K⁺ efflux"
                ],
                explanation: "Presynaptic membrane depolarization opens voltage-gated calcium channels; Ca²⁺ influx directly triggers vesicular exocytosis."
            },
            {
                day: 1,
                dayTitle: "Acetylcholine Release",
                prompt: "Acetylcholine is released from the motor neuron terminal by:",
                answer: "Exocytosis",
                options: [
                    "Passive diffusion through the membrane",
                    "Endocytosis",
                    "Exocytosis"
                ],
                explanation: "ACh stored in presynaptic vesicles is released into the synaptic cleft via calcium-dependent exocytosis."
            },
            {
                day: 1,
                dayTitle: "End-Plate Potential",
                prompt: "The end-plate potential is:",
                answer: "A graded depolarization of the postsynaptic muscle membrane",
                options: [
                    "A graded depolarization of the postsynaptic muscle membrane",
                    "An action potential traveling down the motor neuron",
                    "Calcium release from the sarcoplasmic reticulum"
                ],
                explanation: "The end-plate potential (EPP) is a local, graded depolarization produced by ACh opening nicotinic ion channels."
            },
            {
                day: 1,
                dayTitle: "ACh Receptor Ions",
                prompt: "Activation of the nicotinic ACh receptor primarily causes:",
                answer: "Na⁺ influx",
                options: [
                    "Na⁺ influx",
                    "Cl⁻ influx",
                    "Ca²⁺ release from the sarcoplasmic reticulum"
                ],
                explanation: "Opening of the nicotinic receptor allows sodium entry down its electrochemical gradient, causing muscle membrane depolarization."
            },
            {
                day: 1,
                dayTitle: "ACh Synthesis",
                prompt: "Which enzyme synthesizes acetylcholine?",
                answer: "Choline acetyltransferase",
                options: [
                    "Acetylcholinesterase",
                    "Choline acetyltransferase",
                    "Monoamine oxidase"
                ],
                explanation: "Choline acetyltransferase (ChAT) synthesizes acetylcholine from acetyl-CoA and choline in the presynaptic terminal."
            },
            {
                day: 1,
                dayTitle: "ACh Breakdown",
                prompt: "Which enzyme terminates acetylcholine signaling at the NMJ?",
                answer: "Acetylcholinesterase",
                options: [
                    "Acetylcholinesterase",
                    "Choline acetyltransferase",
                    "Tyrosine hydroxylase"
                ],
                explanation: "Acetylcholinesterase (AChE) rapidly hydrolyzes acetylcholine into acetate and choline to conclude muscle activation."
            },
            {
                day: 1,
                dayTitle: "Junctional Folds",
                prompt: "What is the primary function of junctional folds?",
                answer: "Increase the surface area of the postsynaptic membrane",
                options: [
                    "Store acetylcholine",
                    "Store calcium for muscle contraction",
                    "Increase the surface area of the postsynaptic membrane"
                ],
                explanation: "Deep junctional folds maximize the postsynaptic surface area to concentrate nicotinic receptors and voltage-gated Na⁺ channels."
            },
            {
                day: 1,
                dayTitle: "Motor Unit",
                prompt: "A motor unit consists of:",
                answer: "One motor neuron and all muscle fibers it innervates",
                options: [
                    "One muscle fiber and all neurons supplying it",
                    "One motor neuron and all muscle fibers it innervates",
                    "One sensory neuron and one motor neuron"
                ],
                explanation: "A single motor neuron together with all the individual muscle fibers it innervates constitutes a single motor unit."
            },
            {
                day: 1,
                dayTitle: "Myasthenia Gravis",
                prompt: "Myasthenia gravis most commonly involves antibodies against:",
                answer: "Postsynaptic nicotinic ACh receptors",
                options: [
                    "Presynaptic voltage-gated Ca²⁺ channels",
                    "Postsynaptic nicotinic ACh receptors",
                    "Acetylcholinesterase"
                ],
                explanation: "Myasthenia gravis is an autoimmune disease caused by autoantibodies targeting postsynaptic nicotinic ACh receptors."
            },
            {
                day: 1,
                dayTitle: "Myasthenia Gravis Buzzword",
                prompt: "Which presentation is most characteristic of myasthenia gravis?",
                answer: "Fatigable weakness with ptosis and diplopia",
                options: [
                    "Fatigable weakness with ptosis and diplopia",
                    "Weakness that improves with repeated use",
                    "Flaccid paralysis with prominent autonomic symptoms"
                ],
                explanation: "Myasthenia gravis classically presents with fluctuating, fatigable skeletal muscle weakness, prominent in extraocular muscles (ptosis/diplopia)."
            },
            {
                day: 1,
                dayTitle: "Lambert-Eaton Syndrome",
                prompt: "Lambert-Eaton myasthenic syndrome is associated with antibodies against:",
                answer: "Presynaptic voltage-gated Ca²⁺ channels",
                options: [
                    "Postsynaptic nicotinic ACh receptors",
                    "Presynaptic voltage-gated Ca²⁺ channels",
                    "Ryanodine receptors"
                ],
                explanation: "Lambert-Eaton syndrome is a paraneoplastic disorder (often small cell lung cancer) targeting presynaptic VGCCs."
            },
            {
                day: 1,
                dayTitle: "Lambert-Eaton Buzzword",
                prompt: "Which finding favors Lambert-Eaton syndrome over myasthenia gravis?",
                answer: "Weakness improves with repeated use",
                options: [
                    "Weakness worsens with repeated use",
                    "Weakness improves with repeated use",
                    "Isolated fluctuating ptosis"
                ],
                explanation: "Repeated muscle exertion facilitates calcium buildup in presynaptic terminals, transiently improving strength in Lambert-Eaton syndrome."
            },
            {
                day: 1,
                dayTitle: "Botulism",
                prompt: "Botulinum toxin causes weakness primarily by:",
                answer: "Blocking presynaptic acetylcholine release",
                options: [
                    "Blocking presynaptic acetylcholine release",
                    "Blocking postsynaptic nicotinic receptors",
                    "Inhibiting acetylcholinesterase"
                ],
                explanation: "Botulinum toxin cleaves SNARE proteins (e.g., SNAP-25), preventing presynaptic ACh vesicle exocytosis and producing flaccid paralysis."
            },
            {
                day: 1,
                dayTitle: "Organophosphate Poisoning",
                prompt: "Organophosphate poisoning causes excessive cholinergic activity by:",
                answer: "Inhibiting acetylcholinesterase",
                options: [
                    "Blocking voltage-gated Ca²⁺ channels",
                    "Inhibiting acetylcholinesterase",
                    "Blocking nicotinic receptors"
                ],
                explanation: "Organophosphates irreversibly inhibit acetylcholinesterase, leading to cholinergic crisis from excess accumulation of ACh."
            },
            {
                day: 1,
                dayTitle: "NMJ Sequence",
                prompt: "Which sequence correctly describes normal neuromuscular transmission?",
                answer: "Action potential → Ca²⁺ influx → ACh release → nicotinic receptor activation",
                options: [
                    "ACh release → Ca²⁺ influx → action potential → receptor activation",
                    "Action potential → Ca²⁺ influx → ACh release → nicotinic receptor activation",
                    "Ca²⁺ release from SR → ACh release → receptor activation → action potential"
                ],
                explanation: "Transmission order: presynaptic action potential $\\rightarrow$ voltage-gated Ca²⁺ influx $\\rightarrow$ ACh exocytosis $\\rightarrow$ postsynaptic nicotinic binding."
            },
            {
                day: 1,
                dayTitle: "Clinical Comparison",
                prompt: "Which pairing is correct?",
                answer: "Botulism — impaired presynaptic ACh release",
                options: [
                    "Myasthenia gravis — presynaptic Ca²⁺ channel antibodies",
                    "Lambert-Eaton — postsynaptic ACh receptor antibodies",
                    "Botulism — impaired presynaptic ACh release"
                ],
                explanation: "Botulism inhibits presynaptic acetylcholine release; Myasthenia Gravis affects postsynaptic AChR, and Lambert-Eaton targets presynaptic Ca²⁺ channels."
            }
        ];

        let state = {
            currentDay: 'all',
            activeCards: [],
            currentIndex: 0,
            doneCount: 0,
            correctCount: 0,
            streakCount: 0,
            isAnswered: false,
            userSelectedOption: null
        };

        // DOM Cache
        const daySelect = document.getElementById('daySelect');
        const statDone = document.getElementById('statDone');
        const statCorrect = document.getElementById('statCorrect');
        const statAccuracy = document.getElementById('statAccuracy');
        const statStreak = document.getElementById('statStreak');
        const resetStatsBtn = document.getElementById('resetStatsBtn');

        const cardCategoryBadge = document.getElementById('cardCategoryBadge');
        const cardProgressText = document.getElementById('cardProgressText');
        const questionPrompt = document.getElementById('questionPrompt');
        const optionsContainer = document.getElementById('optionsContainer');
        const explanationBox = document.getElementById('explanationBox');
        const feedbackTitle = document.getElementById('feedbackTitle');
        const explanationText = document.getElementById('explanationText');
        const nextBtnContainer = document.getElementById('nextBtnContainer');
        const nextBtn = document.getElementById('nextBtn');

        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // Retrieve and shuffle options for current card
        function getShuffledOptions(currentCard) {
            return shuffleArray(currentCard.options);
        }

        function filterCards() {
            state.activeCards = shuffleArray(QUIZ_DATA);
            state.currentIndex = 0;
        }

        function renderCard() {
            if (state.activeCards.length === 0) return;

            state.isAnswered = false;
            state.userSelectedOption = null;

            explanationBox.classList.add('hidden');
            nextBtnContainer.classList.add('hidden');

            const currentCard = state.activeCards[state.currentIndex];
            
            cardCategoryBadge.textContent = `${currentCard.dayTitle}`;
            cardProgressText.textContent = `Card ${state.currentIndex + 1} of ${state.activeCards.length}`;

            questionPrompt.textContent = currentCard.prompt;

            const options = getShuffledOptions(currentCard);
            optionsContainer.innerHTML = '';

            options.forEach((optText, idx) => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = `w-full text-left p-2.5 sm:p-3 rounded-xl border border-slate-300 bg-white hover:bg-slate-50 active:scale-[0.98] transition-all flex items-start gap-2.5 text-clamp-option text-slate-900 font-medium cursor-pointer shadow-sm`;
                
                const letter = String.fromCharCode(65 + idx);
                btn.innerHTML = `
                    <span class="shrink-0 w-5 h-5 rounded-md bg-red-50 border border-red-200 text-[11px] font-bold text-slide-red flex items-center justify-center mt-0.5">
                        ${letter}
                    </span>
                    <span class="flex-1 text-balance">${optText}</span>
                `;

                btn.onclick = () => handleOptionSelect(optText, currentCard, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function handleOptionSelect(selectedOption, currentCard, clickedBtn) {
            if (state.isAnswered) return;
            state.isAnswered = true;

            const isCorrect = selectedOption === currentCard.answer;
            state.doneCount++;

            const optionButtons = optionsContainer.querySelectorAll('button');
            
            optionButtons.forEach(btn => {
                btn.disabled = true;
                btn.classList.remove('hover:bg-slate-50', 'active:scale-[0.98]', 'cursor-pointer');
                btn.classList.add('cursor-default');

                const textSpan = btn.querySelector('span:last-child');
                const optText = textSpan ? textSpan.textContent.trim() : '';

                if (optText === currentCard.answer) {
                    // Highlight Correct Answer in Emerald Green
                    btn.classList.remove('bg-white', 'border-slate-300');
                    btn.classList.add('bg-emerald-50', 'border-emerald-500', 'text-emerald-950', 'ring-1', 'ring-emerald-500');
                    const badge = btn.querySelector('span:first-child');
                    if (badge) {
                        badge.classList.remove('bg-red-50', 'border-red-200', 'text-slide-red');
                        badge.classList.add('bg-emerald-600', 'border-emerald-600', 'text-white');
                    }
                }
            });

            if (isCorrect) {
                state.correctCount++;
                state.streakCount++;
                
                feedbackTitle.className = 'flex items-center gap-1.5 font-bold mb-1 text-emerald-700';
                feedbackTitle.innerHTML = `
                    <svg class="w-4 h-4 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/></svg>
                    <span>Correct! High-Yield Fact</span>
                `;
            } else {
                state.streakCount = 0;
                
                // Highlight incorrect user choice in Red
                clickedBtn.classList.remove('bg-white', 'border-slate-300');
                clickedBtn.classList.add('bg-rose-50', 'border-rose-500', 'text-rose-950');
                const badge = clickedBtn.querySelector('span:first-child');
                if (badge) {
                    badge.classList.remove('bg-red-50', 'border-red-200', 'text-slide-red');
                    badge.classList.add('bg-rose-600', 'border-rose-600', 'text-white');
                }

                feedbackTitle.className = 'flex items-center gap-1.5 font-bold mb-1 text-rose-700';
                feedbackTitle.innerHTML = `
                    <svg class="w-4 h-4 text-rose-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"/></svg>
                    <span>Incorrect &bull; Key High-Yield Concept</span>
                `;
            }

            updateStatsDisplay();

            explanationText.textContent = currentCard.explanation;
            explanationBox.classList.remove('hidden');
            nextBtnContainer.classList.remove('hidden');
        }

        function updateStatsDisplay() {
            statDone.textContent = state.doneCount;
            statCorrect.textContent = state.correctCount;
            
            const accuracy = state.doneCount > 0 
                ? Math.round((state.correctCount / state.doneCount) * 100) 
                : 0;
            statAccuracy.textContent = `(${accuracy}%)`;

            statStreak.textContent = state.streakCount;
        }

        function nextQuestion() {
            state.currentIndex++;
            if (state.currentIndex >= state.activeCards.length) {
                state.activeCards = shuffleArray(state.activeCards);
                state.currentIndex = 0;
            }
            renderCard();
        }

        function resetStats() {
            state.doneCount = 0;
            state.correctCount = 0;
            state.streakCount = 0;
            updateStatsDisplay();
            filterCards();
            renderCard();
        }

        daySelect.addEventListener('change', (e) => {
            state.currentDay = e.target.value;
            filterCards();
            renderCard();
        });

        nextBtn.addEventListener('click', nextQuestion);
        resetStatsBtn.addEventListener('click', resetStats);

        // Keyboard shortcuts (1-3 or A-C to choose option, Space/Enter for Next)
        document.addEventListener('keydown', (e) => {
            if (!state.isAnswered) {
                const keyMap = { '1': 0, '2': 1, '3': 2, 'a': 0, 'b': 1, 'c': 2 };
                const idx = keyMap[e.key.toLowerCase()];
                if (idx !== undefined) {
                    const buttons = optionsContainer.querySelectorAll('button');
                    if (buttons[idx]) buttons[idx].click();
                }
            } else {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    nextQuestion();
                }
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            filterCards();
            renderCard();
            updateStatsDisplay();
        });
    </script>
</body>
</html>
